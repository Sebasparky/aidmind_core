name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security check (dangerous HTML patterns)
        run: npx tsx scripts/check-dangerous-html.ts

      - name: Run tests
        run: npx vitest run
        env:
          # Placeholders only: the Supabase client module needs a URL at import time.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key

      - name: Build
        run: npm run build
